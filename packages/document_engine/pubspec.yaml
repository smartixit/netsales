name: document_engine
description: Reusable document contracts, template registry, and PDF rendering.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.9"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.8
  pdf: ^3.12.0
  printing: ^5.15.1
  payv: 0.1.2
  characters: ^1.4.1

flutter:
  assets:
    - assets/fonts/IBMPlexSansArabic-Regular.ttf
    - assets/licenses/IBM-Plex-Sans-Arabic-OFL.txt

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
