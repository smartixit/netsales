name: Flutter DataGrid Quality Gate

on:
  push:
    branches:
      - main
      - fix/data-grid-final-verification
      - chore/pub-dependency-maintenance
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: datagrid-quality-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    name: Dependencies, format, analyze, tests and Android compile checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Report toolchain
        run: |
          flutter --version
          dart --version
          java -version

      - name: Resolve dependencies and verify lockfile
        run: |
          flutter pub get
          flutter pub get --enforce-lockfile
          grep -q '^  syncfusion_flutter_datagrid:' pubspec.lock
          grep -q '^  syncfusion_flutter_datagrid_export:' pubspec.lock
          grep -q '^  flutter_local_notifications:' pubspec.lock
          grep -q '^  timezone:' pubspec.lock

      - name: Format DataGrid sources on branch pushes
        if: github.event_name == 'push' && github.ref_name != 'chore/pub-dependency-maintenance'
        run: dart format lib/widgets/data_grid test/widgets/data_grid

      - name: Verify Dart formatting
        if: github.head_ref != 'chore/pub-dependency-maintenance' && github.ref_name != 'chore/pub-dependency-maintenance'
        run: dart format --output=none --set-exit-if-changed lib/widgets/data_grid test/widgets/data_grid

      - name: Synchronize generated lockfile and formatting
        id: synchronize
        if: github.event_name == 'push' && github.ref_name != 'chore/pub-dependency-maintenance'
        run: |
          if git diff --quiet -- pubspec.lock lib/widgets/data_grid test/widgets/data_grid; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock lib/widgets/data_grid test/widgets/data_grid
          git commit -m "chore(data-grid): format sources and synchronize dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch verification for the synchronized branch commit
        if: github.event_name == 'push' && steps.synchronize.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/datagrid-quality.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME}"

      - name: Diagnose analyzer inputs
        shell: bash
        run: |
          echo "=== Toolchain ==="
          flutter --version
          dart --version

          echo "=== Analyzer environment ==="
          env | sort | grep -E '^(DART|FLUTTER|PUB|CI)_' || true

          echo "=== Analysis options file ==="
          git status --short -- analysis_options.yaml
          git diff --no-ext-diff HEAD -- analysis_options.yaml || true
          sha256sum analysis_options.yaml
          cat analysis_options.yaml

          echo "=== Analysis options files in checkout ==="
          find . -name analysis_options.yaml -not -path './.git/*' -not -path './.dart_tool/*' -not -path './build/*' -print

          echo "=== Runtime mutation message source, if present in checkout ==="
          grep -RIn --exclude-dir=.git --exclude-dir=.dart_tool --exclude-dir=build -F "Upgrading analysis_options.yaml" . || true

          echo "=== Resolved analyzer/lint packages ==="
          grep -A8 -E '^  (analyzer|flutter_lints|lints):
      - name: Run DataGrid tests
        run: flutter test test/widgets/data_grid

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compile Android Debug sources without packaging an APK
        run: |
          cd android
          gradle --no-daemon :app:checkDebugAarMetadata :app:compileDebugKotlin :app:compileDebugJavaWithJavac :app:compileFlutterBuildDebug
 pubspec.lock || true

          echo "=== Files reported by analyzer ==="
          git status --short -- lib/core/cache/netsales_cache_manager.dart lib/features/auth/presentation/controllers/active_sessions_controller.dart lib/features/onboarding/presentation/controllers/onboarding_controller.dart lib/features/workspace/data/datasources/workspace_local_data_source.dart lib/features/workspace/presentation/controllers/workspace_coordinator_controller.dart

      - name: Analyze project
        run: flutter analyze

      - name: Run DataGrid tests
        run: flutter test test/widgets/data_grid

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compile Android Debug sources without packaging an APK
        run: |
          cd android
          gradle --no-daemon :app:checkDebugAarMetadata :app:compileDebugKotlin :app:compileDebugJavaWithJavac :app:compileFlutterBuildDebug
