name: Flutter DataGrid Quality Gate

on:
  push:
    branches:
      - main
      - fix/data-grid-final-verification
      - chore/pub-dependency-maintenance
      - audit/pub-outdated-report
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: datagrid-quality-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    name: Dependencies, format, analyze, tests and Android compile checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Report toolchain
        run: |
          flutter --version
          dart --version
          java -version

      - name: Resolve dependencies and verify lockfile
        run: |
          flutter pub get
          flutter pub get --enforce-lockfile
          grep -q '^  syncfusion_flutter_datagrid:' pubspec.lock
          grep -q '^  syncfusion_flutter_datagrid_export:' pubspec.lock
          grep -q '^  flutter_local_notifications:' pubspec.lock
          grep -q '^  timezone:' pubspec.lock


      - name: Inventory outdated Pub packages
        if: github.ref_name == 'audit/pub-outdated-report'
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/pub-outdated.json"
          flutter pub outdated --json > "$report"
          python3 - "$report" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text())
          packages = data.get("packages", [])
          if isinstance(packages, dict):
              packages = [dict(value, package=value.get("package", name)) for name, value in packages.items()]

          def value(item, key):
              val = item.get(key, "-")
              if isinstance(val, dict):
                  return val.get("version", val.get("versionString", json.dumps(val, sort_keys=True)))
              return str(val)

          rows = []
          for item in packages:
              name = item.get("package", item.get("name", "unknown"))
              kind = item.get("dependencies", item.get("dependency", "unknown"))
              current = value(item, "current")
              upgradable = value(item, "upgradable")
              resolvable = value(item, "resolvable")
              latest = value(item, "latest")
              direct = "direct" in str(kind).lower()
              changed = len({current, upgradable, resolvable, latest}) > 1
              if direct or changed:
                  rows.append((str(name), str(kind), current, upgradable, resolvable, latest, str(item.get("source", "-"))))

          print("PUB_OUTDATED_REPORT_BEGIN")
          print("package | dependency | current | upgradable | resolvable | latest | source")
          for row in sorted(rows, key=lambda r: ("direct" not in r[1].lower(), r[0])):
              print(" | ".join(row))
          print(f"Reported {len(rows)} direct or version-divergent packages from {len(packages)} total packages.")
          print("PUB_OUTDATED_REPORT_END")
          PY

      - name: Format DataGrid sources on branch pushes
        if: github.event_name == 'push' && github.ref_name != 'chore/pub-dependency-maintenance'
        run: dart format lib/widgets/data_grid test/widgets/data_grid

      - name: Verify Dart formatting
        if: github.head_ref != 'chore/pub-dependency-maintenance' && github.ref_name != 'chore/pub-dependency-maintenance'
        run: dart format --output=none --set-exit-if-changed lib/widgets/data_grid test/widgets/data_grid

      - name: Synchronize generated lockfile and formatting
        id: synchronize
        if: github.event_name == 'push' && github.ref_name != 'chore/pub-dependency-maintenance'
        run: |
          if git diff --quiet -- pubspec.lock lib/widgets/data_grid test/widgets/data_grid; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock lib/widgets/data_grid test/widgets/data_grid
          git commit -m "chore(data-grid): format sources and synchronize dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch verification for the synchronized branch commit
        if: github.event_name == 'push' && steps.synchronize.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/datagrid-quality.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME}"

      - name: Analyze project
        run: flutter analyze

      - name: Run DataGrid tests
        run: flutter test test/widgets/data_grid

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compile Android Debug sources without packaging an APK
        run: |
          cd android
          gradle --no-daemon :app:checkDebugAarMetadata :app:compileDebugKotlin :app:compileDebugJavaWithJavac :app:compileFlutterBuildDebug
